# Masked Code Transformer training configuration

# Data
data_dir: "data/urban_prior/5km/splits"      # no-style
vq_checkpoint: "runtimes/vq_vae_5km_new/checkpoints/best.pth"
cache_dir: "cache/masked_code_maps_5km"       # precomputed code maps

# VQ-VAE config (must match checkpoint)
num_codes: 1024
code_map_size: 64
resolution: 256

# Transformer architecture
d_model: 256
num_layers: 6
nhead: 4

# Training
epochs: 50
batch_size: 16
lr: 0.001
num_workers: 8
limit_train: null
limit_val: 200
output_dir: "runtimes/transformer_5km"
